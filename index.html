<style>
@font-face{
  font-family:'CVSerif';
  font-style:normal;
  font-weight:400 600;
  font-display:swap;
  src:url(/fonts/cvserif-regular.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122;
}
@font-face{
  font-family:'CVSerif';
  font-style:italic;
  font-weight:400;
  font-display:swap;
  src:url(/fonts/cvserif-italic.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122;
}

:root{
  --bg:#f3f2f0;
  --surface:#e9e6e3;
  --surface-2:#dfdbd7;
  --ink:#211e1c;
  --ink-soft:#5c5652;
  --ink-faint:#8d8580;
  --line:rgba(33,30,28,0.14);
  --line-strong:rgba(33,30,28,0.34);
  --cyan:#0088b0;
  --cyan-strong:#00647f;
  --cyan-tint:#e2f3f8;
  --cyan-tint-ink:#00566e;
  --magenta:#c8005f;
  --magenta-tint:#fbe7ef;
  --magenta-tint-ink:#8f0044;
  --forest:#1f6f4f;
  --forest-tint:#e7f3ee;
  --forest-tint-ink:#155038;
  --paper-shadow-s:0 1px 2px rgba(33,30,28,.12);
  --paper-shadow-m:0 6px 20px rgba(33,30,28,.14);
  --paper-shadow-l:0 24px 56px rgba(33,30,28,.24);
  --radius-s:3px;--radius-m:7px;--radius-l:14px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;
  --serif:'CVSerif',Georgia,'Iowan Old Style','Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#18201f;
    --surface:#212928;
    --surface-2:#2a3231;
    --ink:#eee9e4;
    --ink-soft:#aaa199;
    --ink-faint:#736c66;
    --line:rgba(238,233,228,0.14);
    --line-strong:rgba(238,233,228,0.32);
    --cyan:#5cc9e6;
    --cyan-strong:#9adcf0;
    --cyan-tint:#12363f;
    --cyan-tint-ink:#bdeaf5;
    --magenta:#ff77ae;
    --magenta-tint:#3a1526;
    --magenta-tint-ink:#ffcfe2;
    --forest:#5cc9a0;
    --forest-tint:#123a2c;
    --forest-tint-ink:#bdf0da;
    --paper-shadow-s:0 1px 2px rgba(0,0,0,.4);
    --paper-shadow-m:0 8px 26px rgba(0,0,0,.45);
    --paper-shadow-l:0 28px 64px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18201f;--surface:#212928;--surface-2:#2a3231;--ink:#eee9e4;--ink-soft:#aaa199;--ink-faint:#736c66;
  --line:rgba(238,233,228,0.14);--line-strong:rgba(238,233,228,0.32);
  --cyan:#5cc9e6;--cyan-strong:#9adcf0;--cyan-tint:#12363f;--cyan-tint-ink:#bdeaf5;
  --magenta:#ff77ae;--magenta-tint:#3a1526;--magenta-tint-ink:#ffcfe2;
  --forest:#5cc9a0;--forest-tint:#123a2c;--forest-tint-ink:#bdf0da;
  --paper-shadow-s:0 1px 2px rgba(0,0,0,.4);--paper-shadow-m:0 8px 26px rgba(0,0,0,.45);--paper-shadow-l:0 28px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f2f0;--surface:#e9e6e3;--surface-2:#dfdbd7;--ink:#211e1c;--ink-soft:#5c5652;--ink-faint:#8d8580;
  --line:rgba(33,30,28,0.14);--line-strong:rgba(33,30,28,0.34);
  --cyan:#0088b0;--cyan-strong:#00647f;--cyan-tint:#e2f3f8;--cyan-tint-ink:#00566e;
  --magenta:#c8005f;--magenta-tint:#fbe7ef;--magenta-tint-ink:#8f0044;
  --forest:#1f6f4f;--forest-tint:#e7f3ee;--forest-tint-ink:#155038;
  --paper-shadow-s:0 1px 2px rgba(33,30,28,.12);--paper-shadow-m:0 6px 20px rgba(33,30,28,.14);--paper-shadow-l:0 24px 56px rgba(33,30,28,.24);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.1;letter-spacing:-0.012em;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit}
::selection{background:color-mix(in srgb, var(--cyan) 30%, transparent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.app-shell{min-height:100vh;display:flex;flex-direction:column}
.is-printing .app-shell{display:none}

/* ---- header ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--line);
}
.brand{
  font-size:22px;font-weight:600;letter-spacing:0.03em;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.brand-mark{width:28px;height:28px;display:block}
.brand-text{display:flex;align-items:baseline;gap:2px}
.brand em{font-style:italic;color:var(--cyan)}
.topbar-actions{display:flex;align-items:center;gap:var(--sp-3)}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--serif);font-weight:600;font-size:14.5px;line-height:1.2;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:11px 20px;border-radius:var(--radius-m);transition:background .15s ease,border-color .15s ease,opacity .15s ease;
  white-space:nowrap;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--cyan);color:var(--bg)}
.btn-primary:hover:not(:disabled){background:var(--cyan-strong)}
.btn-secondary{border-color:var(--line-strong)}
.btn-secondary:hover:not(:disabled){background:color-mix(in srgb, var(--ink) 6%, transparent)}
.btn-ghost{color:var(--cyan);padding-inline:8px}
.btn-ghost:hover{background:color-mix(in srgb, var(--cyan) 12%, transparent)}
.btn-lg{font-size:16.5px;padding:14px 26px}
.btn-sm{font-size:13px;padding:7px 14px}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;font-size:11.5px;letter-spacing:0.03em;padding:4px 11px;border-radius:999px;font-family:var(--serif);font-weight:600}
.tag-cyan{background:var(--cyan-tint);color:var(--cyan-tint-ink)}
.tag-magenta{background:var(--magenta-tint);color:var(--magenta-tint-ink)}
.tag-forest{background:var(--forest-tint);color:var(--forest-tint-ink)}
.tag-neutral{background:var(--surface-2);color:var(--ink-soft)}
.tag-outline{border:1px solid var(--cyan);color:var(--cyan)}
.tag-ink-outline{border:1px solid var(--ink);color:var(--ink)}

/* ---- form ---- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--ink-soft);letter-spacing:0.02em}
.input{
  width:100%;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  caret-color:var(--cyan);
}
.input::placeholder{color:var(--ink-faint)}
.input:hover{border-color:var(--line-strong)}
.input:focus-visible{border-color:var(--cyan)}
textarea.input{resize:vertical;line-height:1.6;font-family:var(--serif)}

/* ---- card ---- */
.card{background:var(--surface);border-radius:var(--radius-m);padding:var(--sp-4)}
.card-elev{box-shadow:var(--paper-shadow-s)}

/* ---- landing ---- */
.landing{flex:1;display:flex;justify-content:center;padding:var(--sp-8) var(--sp-6) var(--sp-7)}
.landing-inner{max-width:760px;width:100%}
.hero-title{font-size:clamp(36px,6vw,64px);margin:0 0 var(--sp-4)}
.hero-title em{font-style:italic;color:var(--cyan)}
.hero-sub{font-size:19px;line-height:1.6;color:var(--ink-soft);max-width:600px;margin-bottom:var(--sp-5)}
.plans-heading{font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);font-style:italic;margin:0 0 var(--sp-4)}
.plans-row{display:flex;gap:var(--sp-4);flex-wrap:wrap}
.plan-card{width:240px;border:1px solid var(--line);border-radius:var(--radius-m);padding:var(--sp-4);display:flex;flex-direction:column;gap:8px}
.plan-kicker{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan)}
.plan-price{font-size:26px;font-weight:600}
.plan-price small{font-size:13px;font-weight:400;color:var(--ink-soft)}
.plan-feature{font-size:13.5px;color:var(--ink-soft);line-height:1.6}

/* ---- flow layout ---- */
.flow{flex:1;display:flex;align-items:flex-start;gap:var(--sp-6);padding:var(--sp-5) var(--sp-6) var(--sp-7);max-width:1180px;margin:0 auto;width:100%}
.rail{width:196px;flex-shrink:0;display:flex;flex-direction:column;gap:var(--sp-2);padding-top:var(--sp-2)}
.rail-item{
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;cursor:default;
  background:transparent;transition:background .15s ease;
}
.rail-item[data-enabled="1"]{cursor:pointer}
.rail-num{font-size:14px;font-weight:600;color:var(--cyan);font-variant-numeric:tabular-nums}
.rail-label{font-size:14.5px;color:var(--ink)}
.rail-item.active{background:var(--cyan);box-shadow:var(--paper-shadow-s)}
.rail-item.active .rail-num,.rail-item.active .rail-label{color:var(--bg)}

.step-panel{flex:1;min-width:0;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.step-title{font-size:clamp(26px,4vw,33px);margin-bottom:var(--sp-2)}
.step-desc{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:560px;margin-bottom:var(--sp-4)}
.cv-import-row{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
.cv-import-row label{cursor:pointer}
.cv-import-hint{font-size:12.5px;color:var(--ink-faint)}
.lang-check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin:var(--sp-3) 0 0;cursor:pointer;max-width:560px}
.lang-check input{flex-shrink:0}
.lang-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-3)}
.lang-error{font-size:12px;color:var(--magenta)}
.step-actions{display:flex;justify-content:space-between;margin-top:var(--sp-5)}
.step-actions.end{justify-content:flex-end}

/* ---- analysis ---- */
.score-row{display:flex;align-items:baseline;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.score-num{font-size:clamp(64px,10vw,96px);font-weight:600;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.score-num span{font-size:34px}
.kw-cols{display:flex;gap:var(--sp-6);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.kw-col{min-width:250px}
.kw-col h3{font-size:15px;margin-bottom:var(--sp-2)}
.kw-tags{display:flex;flex-wrap:wrap;gap:7px}
.kw-empty{color:var(--ink-faint);font-size:14px}

/* ---- results ---- */
.tabs-row{display:flex;gap:8px;margin-bottom:var(--sp-4);flex-wrap:wrap}
.template-heading{font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);font-style:italic;margin-bottom:var(--sp-2)}
.template-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:var(--sp-4)}
.template-card{width:130px;border:1px solid var(--line);border-radius:var(--radius-s);padding:9px;cursor:pointer;background:var(--bg)}
.template-card.selected{border-width:2px}
.template-swatch{height:6px;width:100%;border-radius:2px;margin-bottom:7px}
.template-name{font-size:12.5px;font-weight:600}
.template-desc{font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.font-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-2)}
.font-card{border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 14px;cursor:pointer;background:var(--bg);text-align:left}
.font-card.selected{border-width:2px;border-color:var(--ink)}
.font-card-sample{font-size:16px;line-height:1.2}
.font-card-name{font-size:10.5px;color:var(--ink-soft);margin-top:3px}
.font-note{font-size:12px;color:var(--ink-soft);margin:0 0 var(--sp-3);font-style:italic}

.preview-wrap{max-width:640px}
.preview-card{
  position:relative;overflow:hidden;user-select:none;
  background:var(--surface);border-radius:var(--radius-m);padding:var(--sp-5);
  box-shadow:var(--paper-shadow-m);
}
.watermark-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.watermark-grid{position:absolute;inset:-50%;transform:rotate(-24deg);display:flex;flex-wrap:wrap;gap:30px;opacity:0.06}
.watermark-grid span{white-space:nowrap;font-size:17px;font-weight:600;color:var(--ink)}
.obscure-veil{
  position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:var(--sp-5);z-index:10;font-size:15px;color:var(--ink-soft);
}
.cv-doc-name{font-size:28px;margin:0;font-family:inherit}
.cv-doc-role{color:var(--ink-soft);font-size:14.5px;margin:4px 0 2px}
.cv-doc-contact{color:var(--ink-soft);font-size:12.5px;margin:0 0 var(--sp-4)}
.cv-doc-ats-note{font-size:12.5px;color:var(--ink-faint);line-height:1.5;margin-bottom:var(--sp-4)}
.cv-doc-h4{font-size:13.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;margin-top:var(--sp-4)}
.cv-doc-h4:first-of-type{margin-top:0}
.cv-doc-skills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:var(--sp-2)}
.cv-doc-block{margin-bottom:var(--sp-3)}
.cv-doc-block p{line-height:1.65;margin-bottom:6px;white-space:pre-wrap}
.cv-doc-entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);font-weight:600;margin-bottom:3px}
.cv-doc-entry-period{color:var(--ink-soft);font-weight:500;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.cv-doc-bullets{margin:0 0 6px;padding-left:19px}
.cv-doc-bullets li{line-height:1.6;margin-bottom:4px}
.cv-doc-matches{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cv-doc-match{font-size:10.5px;color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;padding:2px 8px}
.cv-doc-langs{font-size:13.5px;color:var(--ink-soft)}

.edit-form{display:flex;flex-direction:column;gap:var(--sp-3)}
.results-actions{display:flex;gap:10px;margin-top:var(--sp-4);flex-wrap:wrap}

.letter-doc-date{text-align:right;color:var(--ink-soft);font-size:13.5px;margin-bottom:var(--sp-3)}
.letter-doc p{line-height:1.7;margin-bottom:var(--sp-3)}
.letter-locked-region{position:relative}
.letter-lock-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);
  background:linear-gradient(rgba(0,0,0,0),var(--bg) 58%);
}
.signature-block{margin-top:var(--sp-3)}
.signature-preview{
  font-style:italic;font-size:32px;color:var(--ink);margin-top:6px;border-bottom:1px solid var(--line-strong);
  display:inline-block;padding:0 4px 5px;
}
.signature-caption{font-size:11px;color:var(--ink-faint);margin-top:4px;letter-spacing:0.04em;text-transform:uppercase}

/* ---- interview ---- */
.interview-list{display:flex;flex-direction:column;gap:10px;max-width:640px}
.interview-card{cursor:pointer;background:var(--surface);border-radius:var(--radius-m);padding:var(--sp-3) var(--sp-4)}
.interview-q-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3)}
.interview-q{font-size:16.5px;font-weight:600}
.interview-toggle{color:var(--cyan);font-size:13.5px;flex-shrink:0}
.interview-tip{font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.55}

/* ---- history ---- */
.history-list{display:flex;flex-direction:column;gap:10px;max-width:640px;margin-bottom:var(--sp-4)}
.history-card{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);background:var(--surface);border-radius:var(--radius-m);padding:var(--sp-3) var(--sp-4);flex-wrap:wrap}
.history-card-role{font-size:15.5px;font-weight:600}
.history-card-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.history-card-actions{display:flex;gap:8px;flex-shrink:0}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 22px;border-radius:var(--radius-m);font-size:14px;box-shadow:var(--paper-shadow-l);
  animation:toastIn .25s ease;z-index:200;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- dialog ---- */
.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:var(--sp-4);background:rgba(20,18,17,0.5);z-index:100}
.dialog{width:min(500px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-5);border-radius:var(--radius-l);background:var(--surface);box-shadow:var(--paper-shadow-l)}
.dialog-title{font-size:21px;font-weight:600}
.dialog-note{color:var(--ink-soft);font-size:13.5px;margin-bottom:var(--sp-3)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:var(--sp-2)}
.plan-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);background:var(--bg);border-radius:var(--radius-m);padding:var(--sp-3) var(--sp-4)}
.plan-row-price{font-size:19px;font-weight:600}
.plan-row-summary{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.method-row{display:flex;gap:8px;margin-bottom:var(--sp-3)}
.momo-row{display:flex;gap:8px;flex-wrap:wrap}
.field-row{display:flex;gap:var(--sp-3)}
.field-row .field{flex:1}

/* ---- print ---- */
.print-root{display:none}
.is-printing .print-root{display:block}
.print-page{
  background:#fff;color:#211e1c;font-family:var(--print-font, 'CVSerif',Georgia,serif);max-width:720px;margin:0 auto;
  padding:60px 68px;line-height:1.65;
  --print-accent:#211e1c;
}
.print-page.compact{padding:44px 60px;line-height:1.45}
.print-close-row{text-align:right;margin-bottom:18px}

.print-page.compact p{margin:0 0 14px;font-size:13.5px}

.print-page.compact .print-skill{padding:2px 9px;font-size:11.5px;margin:0 6px 6px 0}

.print-entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-weight:600;margin-bottom:4px;font-size:14.5px}

@media print{
  .no-print{display:none !important}
  @page{margin:0}
  body{margin:0;background:#fff}
}
@media (max-width:760px){
  .flow{flex-direction:column}
  .rail{width:100%;flex-direction:row;flex-wrap:wrap;padding-top:0}
}
@media (prefers-reduced-motion:reduce){
  .step-panel{animation:none}
  .toast{animation:none}
}

<body>
<div id="app"></div>

<script>
(function(){
"use strict";

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Shared renderer for a CV entry (experience or education) used both on
// screen and in the printed/exported document, so the two stay consistent.
function entryBlockHtml(b, opts){
  const left = [b.role, b.org].filter(Boolean).join(" - ");
  const headHtml = (left || b.period)
    ? `<div class="${opts.headClass}"><span>${esc(left)}</span>${b.period ? `<span class="${opts.periodClass}">${esc(b.period)}</span>` : ""}</div>`
    : "";
  const bulletsHtml = (b.bullets && b.bullets.length)
    ? `<ul class="${opts.bulletsClass}">${b.bullets.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
    : (b.raw ? `<p style="white-space:pre-wrap;margin:0 0 4px">${esc(b.raw)}</p>` : "");
  const matchesHtml = (opts.withMatches && b.matches && b.matches.length)
    ? `<div class="${opts.matchesClass}">${b.matches.map(m => `<span class="${opts.matchClass}">✓ ${esc(m)}</span>`).join("")}</div>`
    : "";
  return `<div class="${opts.wrapClass}">${headHtml}${bulletsHtml}${matchesHtml}</div>`;
}

function blockToEditText(b){
  if (b.raw) return b.raw;
  const headLine = [[b.role, b.org].filter(Boolean).join(" - "), b.period].filter(Boolean).join(" · ");
  const bulletLines = (b.bullets || []).map(x => "- " + x).join("\n");
  return [headLine, bulletLines].filter(Boolean).join("\n");
}

// Six ATS-safe templates (single column, real text, no tables or images) —
// each pairs a screen color (CSS var, theme-aware) with a fixed print color
// (print always renders on white paper, independent of the viewer's theme).
const CV_TEMPLATES = [
  { id: "sobre", name: "Classique sobre", field: "Administration, juridique, finance", description: "Encre neutre, très lisible", swatch: "var(--ink-soft)", nameColor: "var(--ink)", tagClass: "tag-neutral", ruleColor: "var(--line-strong)", printAccent: "#211e1c", printSoft: "#666666", density: "normal" },
  { id: "cyan", name: "Cyan signal", field: "Communication, marketing, digital", description: "Accent cyan sur le nom et les compétences", swatch: "var(--cyan)", nameColor: "var(--cyan)", tagClass: "tag-cyan", ruleColor: "var(--cyan)", printAccent: "#0088b0", printSoft: "#0088b0", density: "normal" },
  { id: "magenta", name: "Magenta éditorial", field: "Création, design, médias", description: "Touche magenta, plus affirmée", swatch: "var(--magenta)", nameColor: "var(--magenta)", tagClass: "tag-magenta", ruleColor: "var(--magenta)", printAccent: "#c8005f", printSoft: "#c8005f", density: "normal" },
  { id: "encre", name: "Contraste encre", field: "Commercial, vente, management", description: "Noir plein, contours nets", swatch: "var(--ink)", nameColor: "var(--ink)", tagClass: "tag-ink-outline", ruleColor: "var(--ink)", printAccent: "#211e1c", printSoft: "#211e1c", density: "normal" },
  { id: "forest", name: "Vert institutionnel", field: "Santé, social, éducation", description: "Vert sobre, ton rassurant", swatch: "var(--forest)", nameColor: "var(--forest)", tagClass: "tag-forest", ruleColor: "var(--forest)", printAccent: "#1f6f4f", printSoft: "#1f6f4f", density: "normal" },
  { id: "tech", name: "Compact technique", field: "Informatique, ingénierie", description: "Mise en page dense, gain de place", swatch: "var(--ink)", nameColor: "var(--ink)", tagClass: "tag-outline", ruleColor: "var(--cyan)", printAccent: "#211e1c", printSoft: "#0088b0", density: "compact" }
];

// Four professional, ATS-safe typefaces (no external font fetch — every
// stack resolves to a font already present on virtually any device), so a
// candidate can visually differentiate their CV/lettre from the default.
const CV_FONTS = [
  { id: "brand", name: "Serif signature", stack: "'CVSerif', Georgia, 'Times New Roman', serif", note: "Le style CVMatch par défaut, chaleureux et distinctif." },
  { id: "georgia", name: "Georgia", stack: "Georgia, 'Times New Roman', serif", note: "Serif élégant et très lisible, un classique des CV modernes." },
  { id: "times", name: "Times New Roman", stack: "'Times New Roman', Times, serif", note: "Le plus traditionnel — attendu en administration, juridique, finance." },
  { id: "arial", name: "Arial", stack: "Arial, Helvetica, sans-serif", note: "Sans-serif neutre, la référence en matière de lisibilité ATS." }
];

// Document-facing section labels (not app-chrome UI, which stays French) —
// switched when the candidate views the optional English CV/letter version.
const SECTION_LABELS = {
  fr: { candidature: "Candidature", summary: "Résumé", skills: "Compétences clés", experience: "Expérience", education: "Formation", languages: "Langues", subject: "Candidature au poste de" },
  en: { candidature: "Application", summary: "Summary", skills: "Key Skills", experience: "Experience", education: "Education", languages: "Languages", subject: "Application for the position of" }
};

const PLAN_DEFS = [
  { id: "free", name: "Gratuit", price: "0 F CFA", period: "", features: ["Aperçu du CV et de la lettre", "Analyse de correspondance", "Version anglaise du CV/lettre", "Filigrane sur les exports"], summary: "Idéal pour tester l'outil." },
  { id: "single", name: "Pack unique", price: "3 000 F CFA", period: "/document", features: ["1 CV + 1 lettre sur mesure", "Version anglaise du CV/lettre", "Export PDF sans filigrane", "Valable 72h"], summary: "Pour une candidature ponctuelle." },
  { id: "monthly", name: "Illimité", price: "9 000 F CFA", period: "/mois", features: ["Générations illimitées", "Version anglaise du CV/lettre", "Export PDF illimité", "Historique des candidatures"], summary: "Pour une recherche active." }
];

const WHATSAPP_NUMBER = "22393030387";
const WHATSAPP_DISPLAY = "+223 93 03 03 87";

function whatsappMessage(ref, planName){
  return `Bonjour, je souhaite payer la formule "${planName}" par Mobile Money. Référence : ${ref}. Je vous envoie la preuve de paiement.`;
}

let state = {
  step: "landing",
  cvText: "", offerText: "",
  cvImportLoading: false, cvImportError: null,
  hasGenerated: false,
  aiResult: null, aiLoading: false, aiError: null,
  includeEnglish: false, aiResultEn: null, aiLoadingEn: false, aiErrorEn: null, resultsLang: "fr",
  resultsTab: "cv",
  dialogOpen: false, checkoutStage: "plans", selectedPlan: null, unlocked: false, paymentProcessing: false,
  cardName: "", cardNumber: "", cardExpiry: "", cardCvc: "",
  toast: null,
  revealedTips: {},
  paymentMethod: "card", momoCode: "", momoCodeError: null,
  momoOrderId: null, momoRef: null, momoWaLink: null, momoStage: "idle", momoErrorMsg: null, momoValidating: false,
  cvEditing: false, cvDraft: null,
  previewObscured: false,
  signatureEnabled: false, signatureText: "",
  cvTemplate: "sobre",
  cvFont: "brand",
  printMode: null,
  history: []
};

const UNLOCK_STORAGE_KEY = "cvmatch_unlock";

function loadStoredUnlock(){
  try {
    const raw = localStorage.getItem(UNLOCK_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e){ return null; }
}
function storeUnlock(orderId, code, plan){
  try { localStorage.setItem(UNLOCK_STORAGE_KEY, JSON.stringify({ orderId, code, plan })); } catch (e){}
}
function clearStoredUnlock(){
  try { localStorage.removeItem(UNLOCK_STORAGE_KEY); } catch (e){}
}

const DRAFT_STORAGE_KEY = "cvmatch_draft";

function loadStoredDraft(){
  try {
    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
    if (!raw) return null;
    const draft = JSON.parse(raw);
    return (draft && (draft.cvText || draft.offerText)) ? draft : null;
  } catch (e){ return null; }
}
let draftSaveTimer = null;
function scheduleDraftSave(){
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => {
    try {
      if (state.cvText.trim() || state.offerText.trim()) {
        localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify({
          cvText: state.cvText, offerText: state.offerText, savedAt: Date.now()
        }));
      } else {
        localStorage.removeItem(DRAFT_STORAGE_KEY);
      }
    } catch (e){}
  }, 500);
}
function clearStoredDraft(){
  clearTimeout(draftSaveTimer);
  try { localStorage.removeItem(DRAFT_STORAGE_KEY); } catch (e){}
}

const HISTORY_STORAGE_KEY = "cvmatch_history";
const HISTORY_MAX = 20;

function loadStoredHistory(){
  try {
    const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e){ return []; }
}
function saveHistoryEntry(entry){
  try {
    const list = loadStoredHistory();
    list.unshift(entry);
    localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
  } catch (e){}
}
function deleteStoredHistoryEntry(id){
  try {
    const list = loadStoredHistory().filter(h => h.id !== id);
    localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
  } catch (e){}
}
function clearStoredHistory(){
  try { localStorage.removeItem(HISTORY_STORAGE_KEY); } catch (e){}
}

const storedDraft = loadStoredDraft();
if (storedDraft){
  state.cvText = storedDraft.cvText || "";
  state.offerText = storedDraft.offerText || "";
}
state.history = loadStoredHistory();

let toastTimer = null;

function setState(patch){
  state = Object.assign({}, state, typeof patch === "function" ? patch(state) : patch);
  scheduleDraftSave();
  render();
}

function firstLine(text, fallback){
  const line = (text || "").split(/\n/).map(l => l.trim()).find(Boolean);
  return line || fallback;
}

function derive(){
  const s = state;
  const aiFr = s.aiResult || {};
  const hasEnglishVersion = !!s.aiResultEn;
  const resultsLang = (s.resultsLang === "en" && hasEnglishVersion) ? "en" : "fr";
  const ai = resultsLang === "en" ? s.aiResultEn : aiFr;

  const cvName = ai.candidateName || firstLine(s.cvText, "Votre nom");
  const cvRole = ai.targetRole || firstLine(s.offerText, "ce poste");

  const score = typeof aiFr.matchScore === "number" ? Math.max(0, Math.min(100, Math.round(aiFr.matchScore))) : 0;
  const matched = Array.isArray(aiFr.matchedKeywords) ? aiFr.matchedKeywords : [];
  const missing = Array.isArray(aiFr.missingKeywords) ? aiFr.missingKeywords : [];
  const analysis = { score, matched, missing };

  const baseCvSummary = ai.summary || "";
  const cvContact = ai.contactLine || "";
  const baseCvSkills = Array.isArray(ai.skills) ? ai.skills : [];
  const aiBlocks = Array.isArray(ai.experience) ? ai.experience : [];
  const baseCvBlocksList = aiBlocks.length
    ? aiBlocks.map(b => ({
        role: b.role || "", org: b.org || "", period: b.period || "",
        bullets: Array.isArray(b.bullets) ? b.bullets : [],
        matches: Array.isArray(b.highlights) ? b.highlights : []
      }))
    : [{ role: "", org: "", period: "", bullets: [], raw: "Ajoutez le détail de vos expériences dans le champ CV pour les voir apparaître ici.", matches: [] }];

  const editingApplies = s.cvDraft && resultsLang === "fr";
  const cvSummary = editingApplies ? s.cvDraft.summary : baseCvSummary;
  const cvSkills = editingApplies ? s.cvDraft.skills.split(",").map(x => x.trim()).filter(Boolean) : baseCvSkills;
  const finalCvBlocks = editingApplies
    ? s.cvDraft.blocks.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).map(t => ({ role: "", org: "", period: "", bullets: [], raw: t, matches: [] }))
    : baseCvBlocksList;
  const cvEducation = Array.isArray(ai.education) ? ai.education : [];
  const cvLanguages = Array.isArray(ai.languages) ? ai.languages : [];

  const letterIntro = ai.letterIntro || "";
  const letterBody = Array.isArray(ai.letterBody) ? ai.letterBody : [];
  const letterClosing = ai.letterClosing || "";

  const stepOrder = ["cv", "offer", "analysis", "results", "interview"];
  const stepLabels = { cv: "Votre CV", offer: "L'offre", analysis: "Analyse", results: "Résultats", interview: "Entretien" };
  const reachable = { cv: true, offer: !!s.cvText.trim(), analysis: !!s.offerText.trim(), results: s.hasGenerated, interview: s.hasGenerated };

  const interviewBank = Array.isArray(aiFr.interviewQuestions) ? aiFr.interviewQuestions : [];

  const currentTemplate = CV_TEMPLATES.find(t => t.id === s.cvTemplate) || CV_TEMPLATES[0];
  const recommendedTemplateId = CV_TEMPLATES.some(t => t.id === aiFr.recommendedTemplate) ? aiFr.recommendedTemplate : null;
  const currentFont = CV_FONTS.find(f => f.id === s.cvFont) || CV_FONTS[0];
  const selectedPlanDef = PLAN_DEFS.find(p => p.id === s.selectedPlan);
  const planLabelMap = { free: "Gratuit", single: "Pack unique", monthly: "Illimité" };
  const currentPlan = s.unlocked ? (s.selectedPlan || "single") : "free";

  const labels = SECTION_LABELS[resultsLang];
  const now = new Date();

  return {
    s, analysis, cvName, cvRole, cvContact, cvBlocks: finalCvBlocks, cvSummary, cvSkills, cvEducation, cvLanguages,
    stepOrder, stepLabels, reachable, interviewBank, currentTemplate, recommendedTemplateId, currentFont, selectedPlanDef, planLabelMap, currentPlan,
    letterIntro, letterBody, letterClosing, resultsLang, hasEnglishVersion, labels,
    todayDate: now.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }),
    todayDateEn: now.toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" })
  };
}

/* ---------------- render pieces ---------------- */

function renderHeader(v){
  const currentPlan = v.currentPlan;
  const planLabel = v.planLabelMap[currentPlan];
  const planTagClass = currentPlan === "free" ? "tag-neutral" : "tag-cyan";
  return `
  <div class="topbar no-print">
    <div class="brand" data-action="goLanding">
      <picture>
        <source srcset="/icons/logo-mark-dark.png" media="(prefers-color-scheme: dark)">
        <img class="brand-mark" src="/icons/logo-mark.png" alt="" width="28" height="28">
      </picture>
      <span class="brand-text">CV<em>Match</em></span>
    </div>
    <div class="topbar-actions">
      <span class="tag ${planTagClass}">${esc(planLabel)}</span>
      ${v.s.history.length ? `<button class="btn btn-ghost" data-action="goStep" data-arg="history">Historique</button>` : ""}
      <button class="btn btn-ghost" data-action="openPricing">Tarifs</button>
    </div>
  </div>`;
}

function renderLanding(v){
  const plansHtml = PLAN_DEFS.map(p => `
    <div class="plan-card">
      <div class="plan-kicker">${esc(p.name)}</div>
      <div class="plan-price">${esc(p.price)}<small> ${esc(p.period)}</small></div>
      ${p.features.map(f => `<div class="plan-feature">- ${esc(f)}</div>`).join("")}
    </div>`).join("");
  return `
  <div class="landing no-print">
    <div class="landing-inner">
      <h1 class="hero-title">Adaptez votre CV et votre lettre de motivation <em>à chaque offre</em></h1>
      <p class="hero-sub">Collez votre CV et l'offre visée. L'outil repère les mots-clés qui comptent, reformule votre CV et rédige une lettre de motivation sur mesure.</p>
      <button class="btn btn-primary btn-lg" data-action="startFlow">Commencer →</button>
      <div style="margin-top:var(--sp-8)">
        <h2 class="plans-heading">Formules</h2>
        <div class="plans-row">${plansHtml}</div>
      </div>
    </div>
  </div>`;
}

function renderRail(v){
  const items = v.stepOrder.map((key, i) => {
    const active = v.s.step === key;
    const enabled = v.reachable[key];
    return `<div class="rail-item ${active ? "active" : ""}" data-enabled="${enabled ? 1 : 0}" style="opacity:${enabled ? 1 : 0.5}" ${enabled ? `data-action="goStep" data-arg="${key}"` : ""}>
      <span class="rail-num">0${i + 1}</span><span class="rail-label">${esc(v.stepLabels[key])}</span>
    </div>`;
  }).join("");
  return `<div class="rail no-print">${items}</div>`;
}

function renderCvStep(v){
  const s = v.s;
  const canGoOffer = !!s.cvText.trim();
  return `
  <div class="step-panel">
    <h2 class="step-title">Votre CV</h2>
    <p class="step-desc">Collez le texte de votre CV actuel, ou importez directement un fichier. Aucune mise en forme requise - l'outil s'occupe de la présentation.</p>
    <div class="cv-import-row">
      <label class="btn btn-secondary btn-sm" for="cvFileInput">${s.cvImportLoading ? "Lecture du fichier…" : "Importer un fichier (PDF ou Word)"}</label>
      <input type="file" id="cvFileInput" data-file-import="cv" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" ${s.cvImportLoading ? "disabled" : ""}>
      <span class="cv-import-hint">.pdf ou .docx, 8 Mo maximum</span>
    </div>
    ${s.cvImportError ? `<p style="color:var(--magenta);font-size:13.5px;margin:0 0 var(--sp-3)">${esc(s.cvImportError)}</p>` : ""}
    <textarea class="input" data-field="cvText" style="width:100%;min-height:340px;font-size:15px" placeholder="Nom Prénom

Expérience professionnelle...

Formation...

Compétences...">${esc(v.s.cvText)}</textarea>
    <div class="step-actions">
      ${(s.cvText.trim() || s.offerText.trim()) ? `<button class="btn btn-ghost btn-sm" data-action="clearDraft">Effacer le brouillon</button>` : `<span></span>`}
      <button class="btn btn-primary" data-action="goToOffer" ${canGoOffer ? "" : "disabled"}>Continuer →</button>
    </div>
  </div>`;
}

function renderOfferStep(v){
  const s = v.s;
  const canGoAnalysis = !!s.offerText.trim() && !s.aiLoading;
  return `
  <div class="step-panel">
    <h2 class="step-title">L'offre visée</h2>
    <p class="step-desc">Collez le texte de l'annonce (intitulé du poste, missions, profil recherché).</p>
    <textarea class="input" data-field="offerText" style="width:100%;min-height:340px;font-size:15px" placeholder="Chargé(e) de communication

Missions...

Profil recherché...">${esc(s.offerText)}</textarea>
    <label class="lang-check">
      <input type="checkbox" data-action="toggleIncludeEnglish" ${s.includeEnglish ? "checked" : ""}>
      Générer aussi une version anglaise du CV et de la lettre (appel IA supplémentaire, quelques secondes de plus)
    </label>
    ${s.aiError ? `<p style="color:var(--magenta);font-size:13.5px;margin:var(--sp-3) 0 0">${esc(s.aiError)}</p>` : ""}
    <div class="step-actions">
      <button class="btn btn-secondary" data-action="goStep" data-arg="cv">← Retour</button>
      <button class="btn btn-primary" data-action="goToAnalysis" ${canGoAnalysis ? "" : "disabled"}>${s.aiLoading ? "Analyse en cours…" : "Analyser →"}</button>
    </div>
  </div>`;
}

function renderAnalysisStep(v){
  const s = v.s;

  if (s.aiLoading){
    return `
    <div class="step-panel">
      <h2 class="step-title">Analyse de correspondance</h2>
      <p class="step-desc">CVMatch compare votre CV et l'offre, puis prépare un CV adapté et une lettre sur mesure - quelques secondes…</p>
    </div>`;
  }

  if (!s.aiResult){
    return `
    <div class="step-panel">
      <h2 class="step-title">Analyse de correspondance</h2>
      <p class="step-desc">Lancez l'analyse pour comparer votre CV à l'offre et préparer vos documents.</p>
      ${s.aiError ? `<p style="color:var(--magenta);font-size:13.5px;margin:0 0 var(--sp-3)">${esc(s.aiError)}</p>` : ""}
      <div class="step-actions">
        <button class="btn btn-secondary" data-action="goStep" data-arg="offer">← Retour</button>
        <button class="btn btn-primary" data-action="goToAnalysis">Analyser →</button>
      </div>
    </div>`;
  }

  const a = v.analysis;
  const scoreLabel = a.score >= 70 ? "Bonne correspondance" : a.score >= 40 ? "Correspondance moyenne" : "À renforcer";
  const scoreTagClass = a.score >= 70 ? "tag-cyan" : a.score >= 40 ? "tag-magenta" : "tag-outline";
  const matchedHtml = a.matched.length
    ? a.matched.map(k => `<span class="tag tag-cyan">${esc(k)}</span>`).join("")
    : `<span class="kw-empty">Aucun mot-clé commun détecté.</span>`;
  const missingHtml = a.missing.length
    ? a.missing.map(k => `<span class="tag tag-outline">${esc(k)}</span>`).join("")
    : `<span class="kw-empty">Rien à ajouter, bon travail.</span>`;
  return `
  <div class="step-panel">
    <h2 class="step-title">Analyse de correspondance</h2>
    <p class="step-desc">Comparaison entre votre CV et l'offre, réalisée par CVMatch.</p>
    <div class="score-row">
      <div class="score-num">${a.score}<span>%</span></div>
      <span class="tag ${scoreTagClass}">${scoreLabel}</span>
    </div>
    <div class="kw-cols">
      <div class="kw-col"><h3>Mots-clés en commun</h3><div class="kw-tags">${matchedHtml}</div></div>
      <div class="kw-col"><h3>Mots-clés à renforcer</h3><div class="kw-tags">${missingHtml}</div></div>
    </div>
    <div class="step-actions">
      <button class="btn btn-secondary" data-action="goStep" data-arg="offer">← Retour</button>
      <button class="btn btn-primary" data-action="generateDocuments">Générer le CV et la lettre →</button>
    </div>
  </div>`;
}

function renderFontPicker(v){
  const s = v.s;
  const cardsHtml = CV_FONTS.map(f => `
    <div class="font-card ${f.id === s.cvFont ? "selected" : ""}" data-action="selectFont" data-arg="${f.id}">
      <div class="font-card-sample" style="font-family:${f.stack}">Aa</div>
      <div class="font-card-name">${esc(f.name)}</div>
    </div>`).join("");
  return `
    <div class="template-heading">Police d'écriture</div>
    <div class="font-row">${cardsHtml}</div>
    <p class="font-note">${esc(v.currentFont.note)}</p>`;
}

function renderCvTab(v){
  const s = v.s;
  const tpl = v.currentTemplate;
  const templatesHtml = CV_TEMPLATES.map(t => `
    <div class="template-card ${t.id === s.cvTemplate ? "selected" : ""}" style="border-color:${t.id === s.cvTemplate ? t.ruleColor : "var(--line)"}" data-action="selectTemplate" data-arg="${t.id}">
      <div class="template-swatch" style="background:${t.swatch}"></div>
      ${t.id === v.recommendedTemplateId ? `<span class="tag tag-cyan" style="font-size:9px;padding:1px 6px;margin-bottom:4px">Recommandé</span>` : ""}
      <div class="template-name">${esc(t.name)}</div>
      <div class="template-desc">${esc(t.field)}</div>
    </div>`).join("");

  const watermark = `<div class="watermark-layer"><div class="watermark-grid">${Array.from({length:30}).map(()=>`<span>APERÇU - NON TÉLÉCHARGÉ</span>`).join("")}</div></div>`;
  const veil = s.previewObscured ? `<div class="obscure-veil">Contenu masqué - revenez sur l'onglet pour afficher l'aperçu</div>` : "";

  let body;
  if (s.cvEditing){
    const draft = s.cvDraft;
    body = `
    <div class="card card-elev edit-form" style="max-width:640px">
      <div class="field"><label>Résumé</label><textarea class="input" data-field="cvDraft.summary" style="min-height:100px">${esc(draft.summary)}</textarea></div>
      <div class="field"><label>Compétences clés (séparées par des virgules)</label><input class="input" data-field="cvDraft.skills" value="${esc(draft.skills)}"></div>
      <div class="field"><label>Expérience - un bloc par expérience, séparés par une ligne vide (1ère ligne : poste - entreprise · dates, lignes suivantes commençant par "-" pour chaque réalisation)</label><textarea class="input" data-field="cvDraft.blocks" style="min-height:220px">${esc(draft.blocks)}</textarea></div>
    </div>`;
  } else {
    const screenExpOpts = {
      wrapClass: "cv-doc-block", headClass: "cv-doc-entry-head", periodClass: "cv-doc-entry-period",
      bulletsClass: "cv-doc-bullets", matchesClass: "cv-doc-matches", matchClass: "cv-doc-match", withMatches: true
    };
    const skillsHtml = v.cvSkills.map(sk => `<span class="tag ${tpl.tagClass}">${esc(sk)}</span>`).join(" ");
    const blocksHtml = v.cvBlocks.map(b => entryBlockHtml(b, screenExpOpts)).join("");
    const educationHtml = v.cvEducation.length
      ? `<div class="cv-doc-h4">${esc(v.labels.education)}</div>${v.cvEducation.map(e => entryBlockHtml(
          { role: e.degree, org: e.school, period: e.period, bullets: [], matches: [] }, screenExpOpts
        )).join("")}`
      : "";
    const languagesHtml = v.cvLanguages.length
      ? `<div class="cv-doc-h4">${esc(v.labels.languages)}</div><p class="cv-doc-langs">${esc(v.cvLanguages.join(" · "))}</p>`
      : "";
    body = `
    <div class="preview-card" style="border-top:4px solid ${tpl.ruleColor};font-family:${v.currentFont.stack}" data-block-contextmenu="1">
      ${watermark}${veil}
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <h3 class="cv-doc-name" style="color:${tpl.nameColor}">${esc(v.cvName)}</h3>
        <span class="tag tag-magenta">${v.resultsLang === "en" ? "ATS Compatible" : "Compatible ATS"}</span>
      </div>
      <div class="cv-doc-role">${esc(v.labels.candidature)} - ${esc(v.cvRole)}</div>
      ${v.cvContact ? `<div class="cv-doc-contact">${esc(v.cvContact)}</div>` : ""}
      <p class="cv-doc-ats-note">${v.resultsLang === "en" ? "Formatted for Applicant Tracking Systems (ATS): standard section headings, linear text, no tables or graphics." : "Mise en forme optimisée pour les systèmes de suivi des candidatures (ATS) : intitulés de section standards, texte linéaire, sans tableaux ni éléments graphiques."}</p>
      <div class="cv-doc-h4">${esc(v.labels.summary)}</div>
      <p style="line-height:1.6;margin:0 0 var(--sp-4)">${esc(v.cvSummary)}</p>
      <div class="cv-doc-h4">${esc(v.labels.skills)}</div>
      <div class="cv-doc-skills">${skillsHtml}</div>
      <div class="cv-doc-h4">${esc(v.labels.experience)}</div>
      ${blocksHtml}
      ${educationHtml}
      ${languagesHtml}
    </div>`;
  }

  return `
  <div>
    <div class="template-heading">Banque de modèles - inspirez-vous d'un style</div>
    <div class="template-row">${templatesHtml}</div>
    ${renderFontPicker(v)}
    ${v.resultsLang === "fr" ? `
    <div style="display:flex;justify-content:flex-end;max-width:640px;margin-bottom:var(--sp-2)">
      <button class="btn btn-secondary btn-sm" data-action="toggleCvEdit">${s.cvEditing ? "Enregistrer les modifications" : "Modifier le CV"}</button>
    </div>` : `<p class="cv-import-hint" style="margin-bottom:var(--sp-2)">La modification manuelle n'est disponible que pour la version française.</p>`}
    <div class="preview-wrap">${body}</div>
    <div class="results-actions">
      <button class="btn btn-primary" data-action="downloadCv">${s.unlocked ? "Générer le PDF du CV" : "Débloquer l'export PDF"}</button>
    </div>
  </div>`;
}

function renderLetterTab(v){
  const s = v.s;
  const watermark = `<div class="watermark-layer"><div class="watermark-grid">${Array.from({length:30}).map(()=>`<span>APERÇU - NON TÉLÉCHARGÉ</span>`).join("")}</div></div>`;
  const veil = s.previewObscured ? `<div class="obscure-veil">Contenu masqué - revenez sur l'onglet pour afficher l'aperçu</div>` : "";
  const bodyHtml = v.letterBody.map(p => `<p>${esc(p)}</p>`).join("");
  const sigHtml = s.signatureEnabled ? `
    <div class="signature-block">
      <input class="input" data-field="signatureText" style="max-width:280px;font-style:italic" value="${esc(s.signatureText || v.cvName)}">
      <div class="signature-preview">${esc(s.signatureText || v.cvName)}</div>
      <div class="signature-caption">Signature électronique - ${esc(v.todayDate)}</div>
    </div>` : "";
  const lockOverlay = !s.unlocked ? `
    <div class="letter-lock-overlay">
      <div style="font-size:15.5px">Débloquez la lettre complète</div>
      <button class="btn btn-primary" data-action="openPricing">Voir les tarifs</button>
    </div>` : "";

  return `
  ${renderFontPicker(v)}
  <div class="preview-wrap">
    <div class="preview-card letter-doc" style="font-family:${v.currentFont.stack}" data-block-contextmenu="1">
      ${watermark}${veil}
      <div class="letter-doc-date">${esc(v.resultsLang === "en" ? v.todayDateEn : v.todayDate)}</div>
      <p><strong>${v.resultsLang === "en" ? "Subject:" : "Objet :"}</strong> ${esc(v.labels.subject)} ${esc(v.cvRole)}</p>
      <p style="white-space:pre-wrap">${esc(v.letterIntro)}</p>
      <div class="letter-locked-region">
        <div style="filter:${s.unlocked ? "none" : "blur(5px)"};pointer-events:${s.unlocked ? "auto" : "none"}">
          ${bodyHtml}
          <p>${esc(v.letterClosing)}</p>
          ${sigHtml}
        </div>
        ${lockOverlay}
      </div>
    </div>
  </div>
  <div class="results-actions">
    <button class="btn btn-secondary" data-action="toggleSignature">${s.signatureEnabled ? "Retirer la signature" : "+ Ajouter une signature électronique"}</button>
    <button class="btn btn-primary" data-action="downloadLetter">${s.unlocked ? "Générer le PDF de la lettre" : "Débloquer l'export PDF"}</button>
  </div>`;
}

function renderResultsStep(v){
  const s = v.s;
  const langRow = (v.hasEnglishVersion || s.aiLoadingEn) ? `
    <div class="lang-row">
      <button class="btn btn-sm ${v.resultsLang === "fr" ? "btn-primary" : "btn-secondary"}" data-action="setResultsLang" data-arg="fr">Français</button>
      <button class="btn btn-sm ${v.resultsLang === "en" ? "btn-primary" : "btn-secondary"}" data-action="setResultsLang" data-arg="en" ${v.hasEnglishVersion ? "" : "disabled"}>${s.aiLoadingEn ? "English (génération…)" : "English"}</button>
      ${s.aiErrorEn ? `<span class="lang-error">${esc(s.aiErrorEn)}</span>` : ""}
    </div>` : "";
  return `
  <div class="step-panel">
    <h2 class="step-title" style="margin-bottom:var(--sp-4)">Résultats</h2>
    ${langRow}
    <div class="tabs-row">
      <button class="btn ${s.resultsTab === "cv" ? "btn-primary" : "btn-secondary"}" data-action="setResultsTab" data-arg="cv">CV adapté</button>
      <button class="btn ${s.resultsTab === "letter" ? "btn-primary" : "btn-secondary"}" data-action="setResultsTab" data-arg="letter">Lettre de motivation</button>
      <button class="btn btn-secondary" data-action="goStep" data-arg="interview">Simulation d'entretien</button>
    </div>
    ${s.resultsTab === "cv" ? renderCvTab(v) : renderLetterTab(v)}
  </div>`;
}

function renderInterviewStep(v){
  const items = v.interviewBank.map((iq, i) => {
    const revealed = !!v.s.revealedTips[i];
    return `
    <div class="interview-card" data-action="toggleTip" data-arg="${i}">
      <div class="interview-q-row">
        <div class="interview-q">${esc(iq.question)}</div>
        <span class="interview-toggle">${revealed ? "Masquer le conseil" : "Voir un conseil"}</span>
      </div>
      ${revealed ? `<div class="interview-tip">${esc(iq.tip)}</div>` : ""}
    </div>`;
  }).join("");
  return `
  <div class="step-panel">
    <h2 class="step-title">Simulation d'entretien</h2>
    <p class="step-desc">Questions probables pour le poste de ${esc(v.cvRole)}, générées à partir de l'offre. Cliquez sur une question pour voir un conseil de réponse.</p>
    <div class="interview-list">${items}</div>
    <div class="step-actions" style="max-width:640px">
      <button class="btn btn-secondary" data-action="goStep" data-arg="results">← Retour aux résultats</button>
      <button class="btn btn-primary" data-action="downloadInterview">Imprimer les questions et conseils</button>
    </div>
  </div>`;
}

function formatHistoryDate(ts){
  try {
    return new Date(ts).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) +
      " à " + new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch (e){ return ""; }
}

function renderHistoryStep(v){
  const s = v.s;
  if (!s.history.length){
    return `
    <div class="step-panel">
      <h2 class="step-title">Historique des candidatures</h2>
      <p class="step-desc">Vos candidatures générées apparaîtront ici automatiquement dans ce navigateur, pour les retrouver sans tout recommencer.</p>
    </div>`;
  }
  const rows = s.history.map(h => `
    <div class="history-card">
      <div class="history-card-main">
        <div class="history-card-role">${esc(h.targetRole || "Poste non précisé")}</div>
        <div class="history-card-meta">${esc(h.candidateName || "")}${h.matchScore != null ? ` · ${h.matchScore}% de correspondance` : ""} · ${esc(formatHistoryDate(h.savedAt))}</div>
      </div>
      <div class="history-card-actions">
        <button class="btn btn-secondary btn-sm" data-action="loadHistoryEntry" data-arg="${h.id}">Revoir</button>
        <button class="btn btn-ghost btn-sm" data-action="deleteHistoryEntry" data-arg="${h.id}">Supprimer</button>
      </div>
    </div>`).join("");
  return `
  <div class="step-panel">
    <h2 class="step-title">Historique des candidatures</h2>
    <p class="step-desc">Conservé localement dans ce navigateur - ${s.history.length} candidature(s) sur ${HISTORY_MAX} maximum.</p>
    <div class="history-list">${rows}</div>
    <div class="step-actions end" style="max-width:640px">
      <button class="btn btn-ghost btn-sm" data-action="clearHistory">Tout effacer</button>
    </div>
  </div>`;
}

function renderFlow(v){
  const s = v.s;
  let panel;
  if (s.step === "cv") panel = renderCvStep(v);
  else if (s.step === "offer") panel = renderOfferStep(v);
  else if (s.step === "analysis") panel = renderAnalysisStep(v);
  else if (s.step === "results") panel = renderResultsStep(v);
  else if (s.step === "interview") panel = renderInterviewStep(v);
  else if (s.step === "history") panel = renderHistoryStep(v);
  return `<div class="flow no-print">${renderRail(v)}${panel}</div>`;
}

function renderDialog(v){
  const s = v.s;
  if (!s.dialogOpen) return "";
  let content;
  if (s.checkoutStage === "plans"){
    const rows = PLAN_DEFS.map(p => `
      <div class="plan-row">
        <div>
          <div class="plan-kicker">${esc(p.name)}</div>
          <div class="plan-row-price">${esc(p.price)} <small style="font-size:12.5px;font-weight:400;color:var(--ink-soft)">${esc(p.period)}</small></div>
          <div class="plan-row-summary">${esc(p.summary)}</div>
        </div>
        <button class="btn ${p.id === "free" ? "btn-secondary" : "btn-primary"}" data-action="selectPlan" data-arg="${p.id}">${p.id === "free" ? "Formule actuelle" : "Choisir"}</button>
      </div>`).join("");
    content = `
      <div class="dialog-title">Choisissez votre formule</div>
      <div style="display:flex;flex-direction:column;gap:var(--sp-3)">${rows}</div>
      <div class="dialog-actions"><button class="btn btn-ghost" data-action="closeDialog">Fermer</button></div>`;
  } else if (s.checkoutStage === "payment"){
    const plan = PLAN_DEFS.find(p => p.id === s.selectedPlan);
    const planName = plan ? `${plan.name} - ${plan.price}${plan.period}` : "";
    const cardFields = `
      <div class="field"><label>Nom sur la carte</label><input class="input" data-field="cardName" placeholder="Jeanne Dupont" value="${esc(s.cardName)}"></div>
      <div class="field"><label>Numéro de carte</label><input class="input" data-field="cardNumber" placeholder="4242 4242 4242 4242" value="${esc(s.cardNumber)}"></div>
      <div class="field-row">
        <div class="field"><label>Expiration</label><input class="input" data-field="cardExpiry" placeholder="MM/AA" value="${esc(s.cardExpiry)}"></div>
        <div class="field"><label>CVC</label><input class="input" data-field="cardCvc" placeholder="123" value="${esc(s.cardCvc)}"></div>
      </div>`;
    let momoFields;
    if (s.momoStage === "idle" || s.momoStage === "error"){
      momoFields = `
        <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 var(--sp-3)">Le paiement Mobile Money se confirme par WhatsApp : on crée votre référence, vous nous contactez, on vérifie le paiement puis on vous envoie un code de déverrouillage.</p>
        ${s.momoStage === "error" ? `<p style="color:var(--magenta);font-size:13px;margin:0 0 var(--sp-3)">${esc(s.momoErrorMsg || "Erreur, réessayez.")}</p>` : ""}
        <button class="btn btn-primary" data-action="startMomoOrder" style="width:100%">Continuer vers WhatsApp →</button>`;
    } else if (s.momoStage === "creating"){
      momoFields = `<p style="color:var(--ink-soft);font-size:14px">Préparation de votre référence…</p>`;
    } else {
      momoFields = `
        <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 var(--sp-3)">Référence <strong>${esc(s.momoRef)}</strong> créée. Une fenêtre WhatsApp a dû s'ouvrir vers ${esc(WHATSAPP_DISPLAY)} - appuyez sur <strong>Envoyer</strong> là-bas pour nous contacter.</p>
        <a class="btn btn-secondary" href="${esc(s.momoWaLink)}" target="_blank" rel="noopener" style="width:100%;margin-bottom:var(--sp-3);text-decoration:none">Rouvrir WhatsApp →</a>
        <div class="field"><label>Code reçu par WhatsApp</label><input class="input" data-field="momoCode" placeholder="Ex. 7K2P9QRS" value="${esc(s.momoCode)}" style="text-transform:uppercase;letter-spacing:0.08em"></div>
        ${s.momoCodeError ? `<p style="color:var(--magenta);font-size:13px;margin:var(--sp-2) 0 0">${esc(s.momoCodeError)}</p>` : ""}`;
    }
    content = `
      <div class="dialog-title">Paiement - ${esc(planName)}</div>
      ${s.paymentMethod === "card" ? `<p class="dialog-note">Démonstration - aucun montant n'est réellement débité.</p>` : ""}
      <div class="method-row">
        <button class="btn btn-sm ${s.paymentMethod === "card" ? "btn-primary" : "btn-secondary"}" data-action="setPaymentMethod" data-arg="card">Carte bancaire</button>
        <button class="btn btn-sm ${s.paymentMethod === "momo" ? "btn-primary" : "btn-secondary"}" data-action="setPaymentMethod" data-arg="momo">Mobile Money</button>
      </div>
      ${s.paymentMethod === "card" ? cardFields : momoFields}
      <div class="dialog-actions">
        <button class="btn btn-ghost" data-action="backToPlans">← Formules</button>
        ${s.paymentMethod === "card"
          ? `<button class="btn btn-primary" data-action="submitPayment" ${s.paymentProcessing ? "disabled" : ""}>${s.paymentProcessing ? "Traitement…" : `Payer ${plan ? esc(plan.price) : ""}`}</button>`
          : (s.momoStage === "ready" ? `<button class="btn btn-primary" data-action="validateMomoCode" ${s.momoValidating ? "disabled" : ""}>${s.momoValidating ? "Vérification…" : "Valider le code"}</button>` : "")}
      </div>`;
  } else {
    const plan = PLAN_DEFS.find(p => p.id === s.selectedPlan);
    const planName = plan ? `${plan.name} - ${plan.price}${plan.period}` : "";
    content = `
      <div class="dialog-title">Paiement confirmé</div>
      <p style="line-height:1.6">Formule <strong>${esc(planName)}</strong> activée. L'export PDF sans filigrane est débloqué.</p>
      <div class="dialog-actions"><button class="btn btn-primary" data-action="closeDialog">Continuer</button></div>`;
  }
  return `<div class="dialog-backdrop no-print"><div class="dialog">${content}</div></div>`;
}

function renderToast(v){
  if (!v.s.toast) return "";
  return `<div class="toast no-print">${esc(v.s.toast)}</div>`;
}

function renderPrint(v){
  const s = v.s;
  const tpl = v.currentTemplate;
  const pageClass = tpl.density === "compact" ? "print-page compact" : "print-page";
  const accentStyle = `--print-accent:${tpl.printAccent};--print-font:${v.currentFont.stack}`;
  if (s.printMode === "cv"){
    const printExpOpts = {
      wrapClass: "print-exp-block", headClass: "print-entry-head", periodClass: "print-entry-period",
      bulletsClass: "print-bullets", matchesClass: "", matchClass: "", withMatches: false
    };
    const skills = v.cvSkills.map(sk => `<span class="print-skill">${esc(sk)}</span>`).join(" ");
    const blocks = v.cvBlocks.map(b => entryBlockHtml(b, printExpOpts)).join("");
    const educationHtml = v.cvEducation.length
      ? `<h2>${esc(v.labels.education)}</h2>${v.cvEducation.map(e => entryBlockHtml(
          { role: e.degree, org: e.school, period: e.period, bullets: [], matches: [] }, printExpOpts
        )).join("")}`
      : "";
    const languagesHtml = v.cvLanguages.length
      ? `<h2>${esc(v.labels.languages)}</h2><p class="print-langs">${esc(v.cvLanguages.join(" · "))}</p>`
      : "";
    return `
    <div class="${pageClass}" style="${accentStyle}">
      <div class="print-close-row no-print"><button class="btn btn-secondary" data-action="cancelPrint">Fermer l'aperçu</button></div>
      <h1>${esc(v.cvName)}</h1>
      <div class="print-role">${esc(v.labels.candidature)} - ${esc(v.cvRole)}</div>
      ${v.cvContact ? `<div class="print-contact">${esc(v.cvContact)}</div>` : ""}
      <h2>${esc(v.labels.summary)}</h2><p>${esc(v.cvSummary)}</p>
      <h2>${esc(v.labels.skills)}</h2><div style="margin:0 0 24px">${skills}</div>
      <h2>${esc(v.labels.experience)}</h2>${blocks}
      ${educationHtml}
      ${languagesHtml}
    </div>`;
  }
  if (s.printMode === "letter"){
    return `
    <div class="${pageClass}" style="${accentStyle}">
      <div class="print-close-row no-print"><button class="btn btn-secondary" data-action="cancelPrint">Fermer l'aperçu</button></div>
      <div class="letter-head"><div><div class="letter-name">${esc(v.cvName)}</div>${v.cvContact ? `<div class="print-contact" style="margin:2px 0 0">${esc(v.cvContact)}</div>` : ""}</div><div class="letter-date">${esc(v.resultsLang === "en" ? v.todayDateEn : v.todayDate)}</div></div>
      <p class="letter-object"><strong>${v.resultsLang === "en" ? "Subject:" : "Objet :"}</strong> ${esc(v.labels.subject)} ${esc(v.cvRole)}</p>
      <p style="white-space:pre-wrap">${esc(v.letterIntro)}</p>
      ${v.letterBody.map(p => `<p>${esc(p)}</p>`).join("")}
      <p>${esc(v.letterClosing)}</p>
      ${s.signatureEnabled ? `<div class="letter-sig">${esc(s.signatureText || v.cvName)}</div>` : ""}
    </div>`;
  }
  if (s.printMode === "interview"){
    const itemsHtml = v.interviewBank.map((iq, i) => `
      <div class="print-interview-item">
        <div class="print-interview-q">${i + 1}. ${esc(iq.question)}</div>
        <div class="print-interview-tip">${esc(iq.tip)}</div>
      </div>`).join("");
    return `
    <div class="${pageClass}" style="${accentStyle}">
      <div class="print-close-row no-print"><button class="btn btn-secondary" data-action="cancelPrint">Fermer l'aperçu</button></div>
      <h1>${esc(v.cvName)}</h1>
      <div class="print-role">Préparation à l'entretien - ${esc(v.cvRole)}</div>
      <h2>Questions probables et conseils de réponse</h2>
      ${itemsHtml}
    </div>`;
  }
  return "";
}

function render(){
  const active = document.activeElement;
  let restore = null;
  const appEl = document.getElementById("app");
  if (active && active.dataset && active.dataset.field && appEl.contains(active)){
    restore = { field: active.dataset.field, start: active.selectionStart, end: active.selectionEnd, scrollTop: active.scrollTop };
  }

  const v = derive();
  document.documentElement.classList.toggle("is-printing", !!v.s.printMode);

  const html = `
    <div class="app-shell">
      ${renderHeader(v)}
      ${v.s.step === "landing" ? renderLanding(v) : renderFlow(v)}
    </div>
    ${renderToast(v)}
    ${renderDialog(v)}
    <div class="print-root">${renderPrint(v)}</div>
  `;
  appEl.innerHTML = html;

  if (restore){
    const el = appEl.querySelector(`[data-field="${CSS.escape(restore.field)}"]`);
    if (el){
      el.focus();
      if (typeof el.setSelectionRange === "function" && restore.start != null){
        try { el.setSelectionRange(restore.start, restore.end); } catch(e){}
      }
      el.scrollTop = restore.scrollTop;
    }
  }
}

/* ---------------- actions ---------------- */

function showToast(msg){
  setState({ toast: msg });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => setState({ toast: null }), 2600);
}

const Actions = {
  goLanding: () => setState({ step: "landing" }),
  startFlow: () => setState({ step: "cv" }),
  goStep: (key) => setState({ step: key }),
  goToOffer: () => { if (state.cvText.trim()) setState({ step: "offer" }); },
  importCvFile: (file) => {
    const MAX_BYTES = 8 * 1024 * 1024;
    if (file.size > MAX_BYTES) {
      setState({ cvImportError: "Fichier trop volumineux (8 Mo maximum)." });
      return;
    }
    // No blocking window.confirm() here: native dialogs are silently
    // suppressed in some mobile in-app browsers (WhatsApp, Facebook, ...),
    // which would make the import look like it does nothing at all.
    setState({ cvImportLoading: true, cvImportError: null });
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const base64 = String(reader.result || "").split(",")[1] || "";
        if (!base64) throw new Error("Impossible de lire le contenu de ce fichier.");
        fetch("/api/extract-cv", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, mimeType: file.type, dataBase64: base64 })
        })
          .then(r => r.json().catch(() => ({})).then(data => ({ ok: r.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error((data && data.error) || "Erreur lors de la lecture du fichier.");
            setState({ cvText: data.text, cvImportLoading: false, cvImportError: null });
          })
          .catch(err => {
            console.error("CV import failed", err);
            setState({ cvImportLoading: false, cvImportError: (err && err.message) || "Erreur réseau, réessayez." });
          });
      } catch (err) {
        console.error("CV import failed (onload)", err);
        setState({ cvImportLoading: false, cvImportError: (err && err.message) || "Erreur lors de la lecture du fichier." });
      }
    };
    reader.onerror = () => setState({ cvImportLoading: false, cvImportError: "Impossible de lire ce fichier." });
    reader.readAsDataURL(file);
  },
  clearDraft: () => {
    if (!window.confirm("Effacer le CV et l'offre actuellement saisis ?")) return;
    clearStoredDraft();
    setState({ cvText: "", offerText: "", cvImportError: null });
  },
  toggleIncludeEnglish: () => setState(s => ({ includeEnglish: !s.includeEnglish })),
  setResultsLang: (lang) => setState(s => ({
    resultsLang: lang === "en" ? "en" : "fr",
    cvEditing: lang === "en" ? false : s.cvEditing
  })),
  goToAnalysis: () => {
    if (!state.offerText.trim() || state.aiLoading) return;
    const wantEnglish = state.includeEnglish;
    setState({
      step: "analysis", aiLoading: true, aiError: null,
      aiResultEn: null, aiErrorEn: null, aiLoadingEn: wantEnglish, resultsLang: "fr"
    });
    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cvText: state.cvText, offerText: state.offerText })
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) {
          const base = (data && data.error) || "Erreur lors de la génération, réessayez.";
          const detail = data && data.detail;
          throw new Error(detail ? base + " (détail : " + detail + ")" : base);
        }
        const validTemplates = CV_TEMPLATES.map(t => t.id);
        const recommended = validTemplates.includes(data.result.recommendedTemplate) ? data.result.recommendedTemplate : "sobre";
        setState({ aiResult: data.result, aiLoading: false, aiError: null, cvTemplate: recommended });
      })
      .catch(err => {
        setState({ aiLoading: false, aiError: (err && err.message) || "Erreur réseau, réessayez." });
      });

    if (wantEnglish) {
      fetch("/api/generate-english", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cvText: state.cvText, offerText: state.offerText })
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) {
            const base = (data && data.error) || "Erreur lors de la génération anglaise, réessayez.";
            const detail = data && data.detail;
            throw new Error(detail ? base + " (détail : " + detail + ")" : base);
          }
          setState({ aiResultEn: data.result, aiLoadingEn: false, aiErrorEn: null });
        })
        .catch(err => {
          setState({ aiLoadingEn: false, aiErrorEn: (err && err.message) || "Erreur réseau, réessayez." });
        });
    }
  },
  generateDocuments: () => {
    const ai = state.aiResult;
    if (ai) {
      saveHistoryEntry({
        id: "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        savedAt: Date.now(),
        candidateName: ai.candidateName || "",
        targetRole: ai.targetRole || "",
        matchScore: typeof ai.matchScore === "number" ? ai.matchScore : null,
        cvText: state.cvText,
        offerText: state.offerText,
        cvTemplate: state.cvTemplate,
        cvFont: state.cvFont,
        aiResult: ai,
        aiResultEn: state.aiResultEn || null
      });
    }
    setState({ step: "results", hasGenerated: true, cvDraft: null, cvEditing: false, history: loadStoredHistory() });
  },
  loadHistoryEntry: (id) => {
    const entry = state.history.find(h => h.id === id);
    if (!entry) return;
    const validTemplates = CV_TEMPLATES.map(t => t.id);
    const validFonts = CV_FONTS.map(f => f.id);
    setState({
      step: "results", resultsTab: "cv",
      cvText: entry.cvText || "", offerText: entry.offerText || "",
      aiResult: entry.aiResult, aiError: null, aiLoading: false, hasGenerated: true,
      aiResultEn: entry.aiResultEn || null, aiErrorEn: null, aiLoadingEn: false, resultsLang: "fr",
      cvTemplate: validTemplates.includes(entry.cvTemplate) ? entry.cvTemplate : "sobre",
      cvFont: validFonts.includes(entry.cvFont) ? entry.cvFont : "brand",
      cvDraft: null, cvEditing: false
    });
  },
  deleteHistoryEntry: (id) => {
    deleteStoredHistoryEntry(id);
    setState({ history: loadStoredHistory() });
  },
  clearHistory: () => {
    if (!window.confirm("Effacer tout l'historique des candidatures ?")) return;
    clearStoredHistory();
    setState({ history: [] });
  },

  setResultsTab: (tab) => setState({ resultsTab: tab }),
  toggleTip: (i) => setState(s => ({ revealedTips: Object.assign({}, s.revealedTips, { [i]: !s.revealedTips[i] }) })),

  openPricing: () => setState({ dialogOpen: true, checkoutStage: "plans" }),
  closeDialog: () => setState({ dialogOpen: false }),
  backToPlans: () => setState({ checkoutStage: "plans" }),
  selectPlan: (planId) => {
    if (planId === "free"){
      setState({ selectedPlan: "free", dialogOpen: false });
      showToast("Vous êtes déjà sur la formule gratuite.");
      return;
    }
    setState({
      selectedPlan: planId, checkoutStage: "payment", paymentMethod: "card",
      momoOrderId: null, momoRef: null, momoWaLink: null, momoStage: "idle",
      momoCode: "", momoCodeError: null, momoErrorMsg: null
    });
  },
  setPaymentMethod: (m) => setState({ paymentMethod: m, momoCodeError: null }),
  submitPayment: () => {
    setState({ paymentProcessing: true });
    setTimeout(() => setState({ paymentProcessing: false, unlocked: true, checkoutStage: "success" }), 900);
  },

  startMomoOrder: () => {
    const plan = PLAN_DEFS.find(p => p.id === state.selectedPlan);
    if (!plan) return;
    // Opened synchronously (before the network round-trip) so the browser still treats
    // it as a direct result of the click and does not block it as a popup.
    let winRef = null;
    try { winRef = window.open("about:blank", "_blank"); } catch (e){ winRef = null; }

    setState({ momoStage: "creating", momoErrorMsg: null });

    fetch("/api/create-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan: plan.id })
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) throw new Error((data && data.error) || "Erreur serveur, réessayez.");
        const waLink = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(whatsappMessage(data.ref, plan.name));
        if (winRef && !winRef.closed){
          try { winRef.location.href = waLink; } catch (e){}
        }
        setState({ momoOrderId: data.orderId, momoRef: data.ref, momoWaLink: waLink, momoStage: "ready" });
      })
      .catch(err => {
        if (winRef && !winRef.closed) try { winRef.close(); } catch (e){}
        setState({ momoStage: "error", momoErrorMsg: (err && err.message) || "Erreur réseau, réessayez." });
      });
  },

  validateMomoCode: () => {
    const entered = (state.momoCode || "").trim().toUpperCase();
    if (!entered || !state.momoOrderId){
      setState({ momoCodeError: "Saisissez le code reçu par WhatsApp." });
      return;
    }
    setState({ momoValidating: true, momoCodeError: null });
    fetch("/api/verify-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: state.momoOrderId, code: entered })
    })
      .then(r => r.json())
      .then(data => {
        if (data.ok){
          storeUnlock(state.momoOrderId, entered, data.plan);
          setState({ unlocked: true, checkoutStage: "success", momoCodeError: null, momoValidating: false });
        } else {
          setState({ momoCodeError: data.message || "Code invalide.", momoValidating: false });
        }
      })
      .catch(() => setState({ momoCodeError: "Erreur réseau, réessayez.", momoValidating: false }));
  },

  selectTemplate: (id) => setState({ cvTemplate: id }),
  selectFont: (id) => setState({ cvFont: id }),
  toggleCvEdit: () => {
    if (state.cvEditing){ setState({ cvEditing: false }); return; }
    const v = derive();
    setState({
      cvEditing: true,
      cvDraft: { summary: v.cvSummary, skills: v.cvSkills.join(", "), blocks: v.cvBlocks.map(blockToEditText).join("\n\n") }
    });
  },
  toggleSignature: () => setState(s => ({ signatureEnabled: !s.signatureEnabled, signatureText: s.signatureText || derive().cvName })),

  downloadCv: () => {
    if (!state.unlocked){ Actions.openPricing(); return; }
    setState({ printMode: "cv" });
    setTimeout(() => window.print(), 250);
  },
  downloadLetter: () => {
    if (!state.unlocked){ Actions.openPricing(); return; }
    setState({ printMode: "letter" });
    setTimeout(() => window.print(), 250);
  },
  downloadInterview: () => {
    setState({ printMode: "interview" });
    setTimeout(() => window.print(), 250);
  },
  cancelPrint: () => setState({ printMode: null })
};

function setField(path, value){
  if (path.indexOf(".") === -1){
    setState({ [path]: value });
    return;
  }
  const [obj, key] = path.split(".");
  setState(s => ({ [obj]: Object.assign({}, s[obj], { [key]: value }) }));
}

document.addEventListener("DOMContentLoaded", () => {
  const appEl = document.getElementById("app");

  appEl.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    const arg = el.dataset.arg;
    if (Actions[action]) Actions[action](arg);
  });

  appEl.addEventListener("contextmenu", (e) => {
    if (e.target.closest("[data-block-contextmenu]")){ e.preventDefault(); }
  });

  appEl.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.field) setField(el.dataset.field, el.value);
  });

  appEl.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.fileImport === "cv"){
      const file = el.files && el.files[0];
      el.value = "";
      if (file) Actions.importCvFile(file);
    }
  });

  // Deliberately NOT window "blur"/"focus": those also fire when a native
  // OS dialog opens (e.g. the file picker used for CV import), and
  // re-rendering mid-dialog replaces the <input type="file"> the OS is
  // about to fire "change" on, silently dropping the selected file.
  // visibilitychange only reflects the tab itself being hidden/switched
  // away, which is what this privacy veil is actually meant to catch.
  document.addEventListener("visibilitychange", () => setState({ previewObscured: document.hidden }));
  window.addEventListener("afterprint", () => setState({ printMode: null }));

  render();

  if (storedDraft) showToast("Brouillon restauré.");

  // Silently restore a previous unlock (e.g. after a page reload) by re-checking the
  // stored code against the server - it still enforces the code's real expiry.
  const stored = loadStoredUnlock();
  if (stored && stored.orderId && stored.code){
    fetch("/api/verify-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: stored.orderId, code: stored.code })
    })
      .then(r => r.json())
      .then(data => {
        if (data.ok) setState({ unlocked: true, selectedPlan: data.plan, momoOrderId: stored.orderId, momoCode: stored.code });
        else clearStoredUnlock();
      })
      .catch(() => {});
  }
});
})();
</script>
